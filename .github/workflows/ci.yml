# CI for every pull request and every push to main (issues #6, #7, #10, #11 and #12).
#
#   backend ─┐
#            ├─> images (api, web) ─┐
#   frontend ┘                      ├─> build ─> deploy (staging) ─> e2e   [push to main only]
#   deploy scripts ─────────────────┘
#
# backend:  install, lint, unit tests with the coverage gate (threshold in backend/vitest.config.js),
#           then integration tests against a postgres:17-alpine service container
# frontend: install, lint, unit tests, production build
# images:   build each Docker image once, tag it with the full commit SHA, scan it with
#           Trivy (fails on fixable CRITICAL vulnerabilities) and, on main only, push the
#           exact image that was scanned to GHCR
# deploy scripts: shellcheck and tests for deploy/deploy.sh and deploy/smoke-test.sh, so a
#           broken deploy script is caught in the pull request instead of on the server
# build:    final gate. The protect-main ruleset requires a check called "build", so this
#           job only passes when every job above passed. Keep its name if you rename others.
# deploy (staging): after every merge, runs deploy/deploy.sh on Staging over SSH with the
#           commit SHA, then checks that /health reports that SHA
# e2e:      runs the Playwright tests in tests/e2e against Staging and uploads the HTML report
#
# Actions are pinned to full commit SHAs (the tag is in the comment next to each one),
# so a moved or compromised tag cannot change what runs here.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default. The images job asks for packages: write itself.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
# Runs on main are never cancelled, so every merge gets a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Real database for the integration tests (issue #10). The values are test-only,
    # not secrets. The health check makes the job wait until Postgres accepts connections.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: urlshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d urlshortener"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage gate
        run: npm run test:coverage

      - name: Integration tests (PostgreSQL service)
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/urlshortener

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        run: |
          # shellcheck disable=SC2016 # the backticks are a JavaScript template literal, not shell
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"]
              .map((key) => `| ${key} | ${total[key].pct}% | ${total[key].covered}/${total[key].total} |`);
            console.log(["### Backend unit test coverage", "", "| Metric | Coverage | Covered |", "|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/coverage/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # --reporter=default skips the empty "Vitest Test Report" in the run summary
      # until the front end has tests of its own
      - name: Unit tests
        run: npm test -- --reporter=default

      - name: Production build
        run: npm run build

  images:
    name: image (${{ matrix.service }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR (only used on main)

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
          - service: web
            context: frontend

    env:
      # Names agreed in docs/CONVENTIONS.md. The full commit SHA is the only tag.
      IMAGE: ghcr.io/anhtuanpro0645/swe40006-${{ matrix.service }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once and loaded into the local Docker engine, so the scan below and the
      # push after it use exactly the same image
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Fails the job on CRITICAL vulnerabilities that have a fix available.
      # Unfixed ones are reported by Trivy but cannot be acted on, so they do not block.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.service }}.txt

      - name: Trivy report
        if: ${{ !cancelled() && hashFiles(format('trivy-{0}.txt', matrix.service)) != '' }}
        run: |
          cat "trivy-${{ matrix.service }}.txt"
          {
            echo "### Trivy scan: ${{ matrix.service }} (CRITICAL, fixable)"
            echo
            if [ -s "trivy-${{ matrix.service }}.txt" ]; then
              echo '```'
              cat "trivy-${{ matrix.service }}.txt"
              echo '```'
            else
              echo "No CRITICAL vulnerabilities with a fix available."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        if: ${{ env.PUSH == 'true' }}
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-scripts:
    name: deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck
        run: shellcheck deploy/*.sh deploy/tests/*.sh

      - name: Test deploy.sh
        run: bash deploy/tests/deploy.test.sh

      - name: Test smoke-test.sh
        run: bash deploy/tests/smoke-test.test.sh

  build:
    name: build
    needs: [backend, frontend, images, deploy-scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check that every job passed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          IMAGES: ${{ needs.images.result }}
          DEPLOY_SCRIPTS: ${{ needs.deploy-scripts.result }}
        run: |
          echo "backend:        $BACKEND"
          echo "frontend:       $FRONTEND"
          echo "images:         $IMAGES"
          echo "deploy scripts: $DEPLOY_SCRIPTS"
          for result in "$BACKEND" "$FRONTEND" "$IMAGES" "$DEPLOY_SCRIPTS"; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one CI job did not succeed"
              exit 1
            fi
          done

  deploy-staging:
    name: deploy (staging)
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets come from the "staging" environment, which only main can deploy to
    environment: staging
    # Never two deployments to the same server at once; a newer one waits its turn
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    env:
      APP_DIR: /home/deploy/app
      SMOKE_TEST_ATTEMPTS: 12 # read by deploy/smoke-test.sh: 12 tries, 5 s apart
      SMOKE_TEST_DELAY_SECONDS: 5

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Host key checking stays on: the runner only trusts the host key stored in
      # STAGING_KNOWN_HOSTS, so a different machine on that IP is refused.
      # tr -d '\r' removes Windows line endings a pasted secret may contain.
      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $(printf '%s' "$SSH_HOST" | tr -d '\r[:space:]')
            User $(printf '%s' "$SSH_USER" | tr -d '\r[:space:]')
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy the compose file and deploy script
        run: |
          # shellcheck disable=SC2029 # APP_DIR is meant to expand on the runner
          ssh server "mkdir -p '$APP_DIR'"
          scp deploy/docker-compose.prod.yml deploy/deploy.sh "server:$APP_DIR/"
          # Commits made on Windows lose the executable bit, so set it on the server
          # shellcheck disable=SC2029 # APP_DIR is meant to expand on the runner
          ssh server "chmod 755 '$APP_DIR/deploy.sh'"

      - name: Deploy ${{ github.sha }}
        run: |
          # shellcheck disable=SC2029 # APP_DIR and the SHA are meant to expand on the runner
          ssh server "bash '$APP_DIR/deploy.sh' '$GITHUB_SHA'"

      # Fails the job unless /health answers 200 with the SHA that was just deployed
      - name: Smoke test /health
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          bash deploy/smoke-test.sh "http://$SSH_HOST" "$GITHUB_SHA"
          {
            echo "### Deployed to Staging"
            echo
            echo "\`$GITHUB_SHA\` is running and \`/health\` reports the same SHA."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the SSH key
        if: ${{ always() }}
        run: rm -f ~/.ssh/deploy_key

  e2e:
    name: e2e
    needs: deploy-staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Playwright installs system dependencies for specific Ubuntu versions, so pin one
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # STAGING_HOST can only be read in the "staging" environment
    environment: staging

    env:
      GIT_SHA: ${{ github.sha }}

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      # Same cleaning the deploy job applies to secrets pasted on Windows.
      # Runs in the workspace root because tests/e2e does not exist before checkout.
      - name: Set BASE_URL
        working-directory: .
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          host="$(printf '%s' "$STAGING_HOST" | tr -d '\r[:space:]')"
          [ -n "$host" ] || { echo "::error::STAGING_HOST secret is empty"; exit 1; }
          # The cleaned value is masked too, because it can differ from the secret string
          echo "::add-mask::$host"
          echo "BASE_URL=http://$host" >> "$GITHUB_ENV"

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests against Staging
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
