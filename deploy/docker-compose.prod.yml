# Staging and Production: web (Nginx + Vue), api (Express) and db (PostgreSQL).
#
# Runs the images CI built, scanned and pushed to GHCR. Nothing is built on the server.
# The deploy job (issues #11 and #16) copies this file and deploy.sh to /home/deploy/app
# and runs deploy.sh, which reads two files that are never committed:
#
#   .env        written once per server (database password, IP_HASH_SALT, BASE_URL, ...)
#   image.env   IMAGE_TAG=<full commit SHA>, rewritten by deploy.sh on every deployment
#
# Unlike the local docker-compose.yml, nothing here falls back to a default secret:
# a missing value stops the deployment with an error instead.

name: swe40006-g03

x-logging: &logging
  # Keeps container logs from filling the small EBS disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    image: ghcr.io/anhtuanpro0645/swe40006-api:${IMAGE_TAG:?IMAGE_TAG must be set in image.env}
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BASE_URL: ${BASE_URL:?BASE_URL must be set in .env}
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT must be set in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  web:
    image: ghcr.io/anhtuanpro0645/swe40006-web:${IMAGE_TAG:?IMAGE_TAG must be set in image.env}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

# The network is named so Prometheus (issue #8) can join it and scrape api:3000/metrics
networks:
  default:
    name: swe40006-app

volumes:
  pgdata:
