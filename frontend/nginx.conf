# Nginx serves the built Vue app and forwards API and short-link requests
# to the Express container ("api" on the Docker network).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve "api" through Docker's internal DNS on each request, so Nginx
    # keeps working when the api container is replaced during a deployment.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # Passed to every proxied request. Express trusts one proxy hop, so the
    # rate limiter and click log see the visitor's IP, not Nginx's.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Prometheus scrapes the API directly on the Docker network. Never public.
    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    # Short links: a single path segment with no dot, e.g. /aB3x9Kq.
    # Files such as /favicon.svg contain a dot, so they are served below.
    location ~ "^/[A-Za-z0-9_-]+$" {
        proxy_pass $api_upstream;
    }

    # Vite puts hashed file names in /assets, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate index.html so a new deployment shows up on refresh
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
