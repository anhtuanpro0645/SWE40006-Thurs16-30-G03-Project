global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter runs on the host network, so it is reached through the host gateway
  - job_name: node_exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Needs the app network (see docker-compose.app-network.yml). Shows DOWN until
  # the app is deployed on this server.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
